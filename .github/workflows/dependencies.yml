name: Dependencies

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust advisories, licenses, sources and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: advisories licenses sources bans
          rust-version: 1.92.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Vendored browser libraries match their pinned npm archives
        run: |
          node scripts/vendor-audit.mjs --check
          node scripts/vendor-verify.mjs
      - name: Audit tooling and exact vendored versions
        run: |
          for manifest in frontend/package-lock.json e2e/package-lock.json frontend/vendor/*/package-lock.json; do
            directory="${manifest%/*}"
            npm --prefix "$directory" audit --package-lock-only
          done
