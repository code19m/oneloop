name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/code19m/oneloop

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # To check that the tag is on main.
          persist-credentials: false
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"
      - name: Check that the tag is on main and not released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$RELEASE_TAG is not on main." >&2; exit 1; }
          released=$(node scripts/release-exists.mjs "$RELEASE_TAG")
          if [ "$released" = true ]; then echo "::error::$RELEASE_TAG is already released, and tags never move." >&2; exit 1; fi

  verify:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  dependencies:
    needs: metadata
    uses: ./.github/workflows/dependencies.yml
    permissions:
      contents: read

  image:
    name: image (${{ matrix.platform }})
    needs: [metadata, verify, dependencies]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build natively and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest
    needs: [metadata, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Builds can finish out of version order. Check and move aliases under one lock.
    concurrency:
      group: release-image-tags
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.promote.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published version never moves; a re-run of failed jobs may only repeat it.
      - name: Create the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          digests=(*)
          node "$GITHUB_WORKSPACE/scripts/create-release-image.mjs" "$IMAGE" "$VERSION" "${digests[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Check the SBOM and provenance attestations
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            sbom=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format "{{ json (index .SBOM \"$platform\") }}")
            provenance=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format "{{ json (index .Provenance \"$platform\") }}")
            case "$sbom" in *'"SPDX"'*) ;; *) echo "No SBOM for $platform" >&2; exit 1 ;; esac
            case "$provenance" in *'"SLSA"'*) ;; *) echo "No provenance for $platform" >&2; exit 1 ;; esac
          done
      - name: Promote stable image tags
        id: promote
        if: needs.metadata.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/promote-release-tags.mjs "$IMAGE" "$VERSION"

  github-release:
    name: GitHub release
    needs: [metadata, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release with the CHANGELOG.md notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          LATEST: ${{ needs.manifest.outputs.latest }}
        run: |
          node scripts/release-metadata.mjs "$RELEASE_TAG"
          # GitHub's Latest release follows the image's latest tag, which only moves forward.
          if [ "$PRERELEASE" = true ]; then args=(--prerelease --latest=false); else args=("--latest=$LATEST"); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "oneloop $VERSION" --notes-file target/release-notes.md "${args[@]}"

  docs:
    name: docs
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Deploy the documentation for this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
