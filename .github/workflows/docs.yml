name: Docs

# The site always shows the newest release. Pull requests and pushes to main only
# check the documentation. The Release workflow, or a manual run on main, builds
# the site from the newest release's tag and publishes it.
on:
  pull_request:
    paths:
      - "docs/**"
      - "deploy/**"
      - "*.md"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "deploy/**"
      - "*.md"
      - "scripts/check-doc-links.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer check replaces an older one, but nothing cancels a publish run.
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the newest release
        id: release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(node scripts/newest-release.mjs)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing the documentation of $tag."
      - name: Check out the newest release
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Install mdBook
        run: |
          curl -sSfL -o mdbook.tgz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  mdbook.tgz" | sha256sum -c -
          tar -xzf mdbook.tgz -C "$RUNNER_TEMP" mdbook
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: mdbook build docs
      - name: Check links
        run: node scripts/check-doc-links.mjs
      - if: steps.release.outputs.tag != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book

  deploy:
    if: needs.build.outputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
