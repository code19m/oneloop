[package]
name = "oneloop"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Lightweight, self-hosted task management for small teams, in a single binary"
repository = "https://github.com/code19m/oneloop"
homepage = "https://code19m.github.io/oneloop/"
# Distributed as a Docker image and from source; never published to a registry.
publish = false
build = "build.rs"
# All integration tests live in one crate so Cargo links a single test binary.
autotests = false

[dependencies]
argon2 = { version = "0.6", features = ["getrandom"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "multipart"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
fs4 = { version = "1.1", default-features = false }
hex = "0.4"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
ipnet = "2.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mime_guess = "2.0"
getrandom = "0.4"
rpassword = "7.4"
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "functions"] }
rust-embed = { version = "8.7", features = ["include-exclude"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_urlencoded = "0.7"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["serde", "v7"] }
walkdir = "2.5"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
scraper = "0.27"
proptest = "1.9"
rusqlite = { version = "0.40.2", features = ["trace"] }
assert_cmd = "2.0"
http-body-util = "0.1"
predicates = "3.1"
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[bench]]
name = "workload"
path = "benches/workload.rs"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# Keep application code easy to debug while accelerating password, image and
# SQLite work. Bundled SQLite at opt-level 0 made SQL-heavy tests about twice
# as slow and cost a fifth more test CPU time.
[profile.dev.package.argon2]
opt-level = 2

[profile.dev.package.blake2]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.image-webp]
opt-level = 2

[profile.dev.package.libsqlite3-sys]
opt-level = 2
